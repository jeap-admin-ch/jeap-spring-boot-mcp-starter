    localisedName: jeap-spring-boot-mcp-starter
    shortDescription: Spring Boot starter for exposing jEAP service tools via MCP (Model Context Protocol).
    longDescription: >
      jEAP Spring Boot MCP Starter is a library based on Spring Boot and Spring AI that lets jEAP services expose their
      tools via the Model Context Protocol (MCP), with shared authentication, authorization, protection limits and
      operations support.
    features:
      - MCP server profile based on Spring AI (WebMVC, SYNC, STATELESS)
      - Integration with the jEAP security starter
